[project]
name = "reconciliation-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "asyncpg==0.30.0",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "rasterio>=1.4.3,<2",
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
  "affine>=2.4,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
